name: Publish SDKs

# Runs only for version tags (protected by a ruleset), like release.yml.
# Everything goes to GitHub Packages, never to npmjs / Maven Central / nuget.org:
#   TypeScript/JavaScript -> npm.pkg.github.com, Java -> maven.pkg.github.com, C# -> nuget.pkg.github.com,
#   Ruby -> rubygems.pkg.github.com
# GitHub Packages has no PyPI/Composer/Cargo registry, so Python, PHP and Rust are installed from the git tag.
# Go: the module lives in a subdirectory, so it is "published" by the maintainer pushing the sdk/go/vX.Y.Z tag
# (tags are admin-only); the job checks it exists and then asks proxy.golang.org for it so go get / pkg.go.dev see it immediately (GoReleaser is not needed for a library).
# Python: PyPI via trusted publishing (OIDC, no token). Enable with the repository variable PYPI_PUBLISH=true after
# adding this workflow as a trusted publisher for project `ratelimitd` on pypi.org.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

  npm-github-packages:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/start-ratelimitd
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@phineup'
      - name: Version from tag
        working-directory: sdk/typescript
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
      - name: Test
        working-directory: sdk/typescript
        env:
          RATELIMITD_URL: http://127.0.0.1:18080
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Publish to GitHub Packages
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --tag next ;;
            *)   npm publish ;;
          esac

  maven-github-packages:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/start-ratelimitd
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          server-id: github
      - name: Version from tag
        working-directory: sdk/java
        run: mvn -B -q versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Test and deploy
        working-directory: sdk/java
        env:
          RATELIMITD_URL: http://127.0.0.1:18080
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B deploy

  nuget-github-packages:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/start-ratelimitd
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        working-directory: sdk/csharp
        env:
          RATELIMITD_URL: http://127.0.0.1:18080
        run: dotnet test tests/Ratelimitd.Tests
      - name: Pack
        working-directory: sdk/csharp
        run: dotnet pack src/Ratelimitd -c Release -p:Version="${GITHUB_REF_NAME#v}" -o out
      - name: Push to GitHub Packages
        working-directory: sdk/csharp
        run: |
          dotnet nuget push out/*.nupkg \
            --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

  rubygems-github-packages:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/start-ratelimitd
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Version from tag
        working-directory: sdk/ruby
        run: sed -i "s/^\(  s.version *= *\).*/\1\"${GITHUB_REF_NAME#v}\"/" ratelimitd.gemspec
      - name: Test
        working-directory: sdk/ruby
        env:
          RATELIMITD_URL: http://127.0.0.1:18080
        run: |
          gem install minitest rake --no-document
          rake test
      - name: Build and push to GitHub Packages
        working-directory: sdk/ruby
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gem build ratelimitd.gemspec
          mkdir -p ~/.gem
          printf -- "---\n:github: Bearer %s\n" "$GITHUB_TOKEN" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem push --key github --host "https://rubygems.pkg.github.com/${GITHUB_REPOSITORY_OWNER}" ratelimitd-*.gem

  go-module-proxy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The restrict-tags ruleset only lets admins create tags, so the workflow cannot push
      # sdk/go/vX.Y.Z itself. The maintainer pushes it together with vX.Y.Z (see CONTRIBUTING.md).
      - name: sdk/go tag must exist
        run: |
          tag="sdk/go/${GITHUB_REF_NAME}"
          if ! git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag is missing. Push it next to ${GITHUB_REF_NAME}: git tag -a $tag ${GITHUB_REF_NAME}^{} -m \"sdk/go ${GITHUB_REF_NAME}\" && git push origin $tag"
            exit 1
          fi
      - name: Prime proxy.golang.org
        run: |
          mod=github.com/phineup/ratelimitd/sdk/go
          for i in 1 2 3 4 5; do
            curl -fsS "https://proxy.golang.org/$mod/@v/${GITHUB_REF_NAME}.info" && exit 0
            sleep 10
          done
          echo "proxy.golang.org has not picked up $mod@$GITHUB_REF_NAME yet (it will on first go get)"

  pypi:
    needs: verify
    # Opt-in: set the repository variable PYPI_PUBLISH=true once the PyPI trusted publisher exists.
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/start-ratelimitd
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Version from tag
        working-directory: sdk/python
        run: |
          sed -i "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"${GITHUB_REF_NAME#v}\"/" ratelimitd/__init__.py
      - name: Test
        working-directory: sdk/python
        env:
          RATELIMITD_URL: http://127.0.0.1:18080
        run: python -m unittest discover -s tests -t .
      - name: Build
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
