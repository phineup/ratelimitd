name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Redis (for store equivalence tests)
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: no third-party dependencies
        run: |
          if grep -qE '^\s*(require|replace)' go.mod; then
            echo "go.mod must have no dependencies"; exit 1
          fi

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on every commit
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          for c in $(git rev-list --no-merges "$base..$head"); do
            if ! git log -1 --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "Missing Signed-off-by: $(git log -1 --format='%h %s' "$c")"
              fail=1
            fi
          done
          exit $fail

  # Only the development branch (of this repo, not a fork) may be merged into master.
  source-branch:
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: PRs to master must come from development
        run: |
          if [ "${{ github.head_ref }}" != "development" ] || [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "Pull requests to master must come from the development branch of ${{ github.repository }}."
            exit 1
          fi
