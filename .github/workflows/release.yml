name: Release

# One workflow per version tag (`vX.Y.Z`, created by an admin on master; tags are protected by a ruleset).
# Pull request / branch builds never publish anything.
#
#   test -> binaries ----+
#        -> image -------+-> release (GitHub release + package list in the notes)
#        -> SDK packages (npm, Maven, NuGet, RubyGems, Go tag, PyPI)
#
# Server: binaries for the GitHub release and the container image on ghcr.io (same `v` prefixed tag).
# SDKs go to GitHub Packages, never to npmjs / Maven Central / nuget.org:
#   TypeScript/JavaScript -> npm.pkg.github.com, Java -> maven.pkg.github.com, C# -> nuget.pkg.github.com,
#   Ruby -> rubygems.pkg.github.com
# GitHub Packages has no Composer/Cargo registry, so PHP and Rust are installed from the git tag.
# Go: the module lives in a subdirectory, so it is "published" by the `go-module-proxy` job pushing the
# sdk/go/vX.Y.Z tag (the restrict-tags ruleset excludes sdk/go/*) and asking proxy.golang.org for it.
# Python: PyPI via trusted publishing (OIDC, no token). Enable with the repository variable PYPI_PUBLISH=true after
# adding this workflow (release.yml, environment `pypi`) as a trusted publisher for project `ratelimitd` on pypi.org.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must be on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Tag $GITHUB_REF_NAME is not on master; releases are cut from master only."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test -race ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="ratelimitd_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$name/ratelimitd" ./cmd/ratelimitd
          cp LICENSE README.md config.example.json "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ratelimitd_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Image tags keep the `v` prefix, identical to the git tag (v1.0.1, v1.0, v1).
          # latest is applied only to stable (non-prerelease) tags.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern=v{{major}},enable=${{ !contains(github.ref_name, '-') && !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm-github-packages:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/start-ratelimitd
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@phineup'
      - name: Version from tag
        working-directory: sdk/typescript
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
      - name: Test
        working-directory: sdk/typescript
        env:
          RATELIMITD_URL: http://127.0.0.1:18080
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Publish to GitHub Packages
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --tag next ;;
            *)   npm publish ;;
          esac

  maven-github-packages:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/start-ratelimitd
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          server-id: github
      - name: Version from tag
        working-directory: sdk/java
        run: mvn -B -q versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Test and deploy
        working-directory: sdk/java
        env:
          RATELIMITD_URL: http://127.0.0.1:18080
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B deploy

  nuget-github-packages:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/start-ratelimitd
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        working-directory: sdk/csharp
        env:
          RATELIMITD_URL: http://127.0.0.1:18080
        run: dotnet test tests/Ratelimitd.Tests
      - name: Pack
        working-directory: sdk/csharp
        run: dotnet pack src/Ratelimitd -c Release -p:Version="${GITHUB_REF_NAME#v}" -o out
      - name: Push to GitHub Packages
        working-directory: sdk/csharp
        run: |
          dotnet nuget push out/*.nupkg \
            --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

  rubygems-github-packages:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/start-ratelimitd
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Version from tag
        working-directory: sdk/ruby
        run: sed -i "s/^\(  s.version *= *\).*/\1\"${GITHUB_REF_NAME#v}\"/" ratelimitd.gemspec
      - name: Test
        working-directory: sdk/ruby
        env:
          RATELIMITD_URL: http://127.0.0.1:18080
        run: |
          gem install minitest rake --no-document
          rake test
      - name: Build and push to GitHub Packages
        working-directory: sdk/ruby
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gem build ratelimitd.gemspec
          mkdir -p ~/.gem
          printf -- "---\n:github: Bearer %s\n" "$GITHUB_TOKEN" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem push --key github --host "https://rubygems.pkg.github.com/${GITHUB_REPOSITORY_OWNER}" ratelimitd-*.gem

  go-module-proxy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Go resolves a subdirectory module from the prefixed tag sdk/go/vX.Y.Z. The restrict-tags
      # ruleset excludes refs/tags/sdk/go/* so this job can push it with GITHUB_TOKEN; every
      # other tag stays admin-only.
      - name: Tag sdk/go/<version> (idempotent)
        run: |
          tag="sdk/go/${GITHUB_REF_NAME}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists"; exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
      - name: Prime proxy.golang.org
        run: |
          mod=github.com/phineup/ratelimitd/sdk/go
          for i in 1 2 3 4 5; do
            curl -fsS "https://proxy.golang.org/$mod/@v/${GITHUB_REF_NAME}.info" && exit 0
            sleep 10
          done
          echo "proxy.golang.org has not picked up $mod@$GITHUB_REF_NAME yet (it will on first go get)"

  pypi:
    needs: test
    # Opt-in: set the repository variable PYPI_PUBLISH=true once the PyPI trusted publisher exists.
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/start-ratelimitd
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Version from tag
        working-directory: sdk/python
        run: |
          sed -i "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"${GITHUB_REF_NAME#v}\"/" ratelimitd/__init__.py
      - name: Test
        working-directory: sdk/python
        env:
          RATELIMITD_URL: http://127.0.0.1:18080
        run: python -m unittest discover -s tests -t .
      - name: Build
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/

  release:
    needs: [binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ratelimitd_*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt
      - name: Release notes (package list for this version)
        run: |
          version="${GITHUB_REF_NAME#v}"
          major_minor="v$(echo "$version" | cut -d. -f1,2)"
          sed -e "s|@TAG@|$GITHUB_REF_NAME|g" -e "s|@VERSION@|$version|g" \
              -e "s|@MAJOR_MINOR@|$major_minor|g" -e "s|@REPO@|$GITHUB_REPOSITORY|g" \
              .github/release-notes.md > release-notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The package list goes first; --generate-notes appends the changelog.
          flags="--notes-file release-notes.md --generate-notes --verify-tag"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags="$flags --prerelease"; else flags="$flags --latest"; fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --title "$GITHUB_REF_NAME" $flags
