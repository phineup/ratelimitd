services:
  ratelimitd:
    build: .
    ports: ["8080:8080"]
    environment:
      RATELIMITD_STORE: redis
      RATELIMITD_REDIS_URL: redis://redis:6379/0
      RATELIMITD_AUTH_TOKENS: ${RATELIMITD_AUTH_TOKENS:-}
    volumes:
      - ./config.example.json:/etc/ratelimitd/config.json:ro
    depends_on: [redis]
    healthcheck:
      test: ["CMD", "/ratelimitd", "-healthcheck"]
      interval: 10s
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
volumes:
  redis-data:
